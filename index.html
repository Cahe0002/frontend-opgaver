<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doughnut Chart</title>
    <link rel="stylesheet" href="resources/starter.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 lang="en">These are our stats</h1>
      <section class="stat-list" aria-label="Statistik" lang="en">
        <figure data-value="85">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="track" />
            <circle class="progress" pathLength="100" />
            <circle class="marker" r="4" fill="red" />
          </svg>
          <figcaption>Consistency <span class="stat-value">85%</span></figcaption>
        </figure>

        <figure data-value="95">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="track" />
            <circle class="progress" pathLength="100" />
            <circle class="marker" r="4" fill="red" />
          </svg>
          <figcaption>Improvement <span class="stat-value">95%</span></figcaption>
        </figure>

        <figure data-value="90">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="track" />
            <circle class="progress" pathLength="100" />
            <circle class="marker" r="4" fill="red" />
          </svg>
          <figcaption>Branching <span class="stat-value">90%</span></figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
